name: Regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Linux rules, build and local D1 API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: pnpm
      - name: Install locked dependencies
        run: |
          mkdir -p test-results
          pnpm install --frozen-lockfile 2>&1 | tee test-results/install.log
      - name: TypeScript type check
        run: pnpm typecheck 2>&1 | tee test-results/typecheck.log
      - name: Rules and student-name masking
        run: pnpm test:unit 2>&1 | tee test-results/unit.log
      - name: Production build (no deployment)
        run: pnpm build 2>&1 | tee test-results/build.log
      - name: Independent local D1 API regression
        run: pnpm test:api 2>&1 | tee test-results/api.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs-${{ github.run_attempt }}
          path: test-results/**/*.log
          if-no-files-found: warn
          retention-days: 7
